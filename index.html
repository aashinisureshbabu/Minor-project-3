<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minor Project 03 - Weather and Movie App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
body{font-family:'Inter',sans-serif}
.tab-active{background:white;color:blue;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
.movie-card:hover{transform:translateY(-4px);transition:all .4s}
</style>
</head>
<body class="bg-aqua min-h-screen text-black">
<header class="p-4 md:p-6 flex justify-between items-center max-w-7xl mx-auto">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center"><i class="fas fa-layer-group"></i></div><div><h1 class="font-bold text-lg">Minor Project 03</h1><p class="text-xs text-slate-400">21003663 | API Integration</p></div></div>
<div class="flex bg-slate-800 rounded-full p-1">
<button id="tab-weather" class="px-5 py-2 rounded-full text-sm font-semibold tab-active"><i class="fas fa-cloud-sun mr-2"></i>Weather</button>
<button id="tab-movie" class="px-5 py-2 rounded-full text-sm font-semibold text-slate-400"><i class="fas fa-film mr-2"></i>Movies</button>
</div>
</header>
<section id="weather-section" class="max-w-7xl mx-auto px-4 pb-10">
<div class="grid lg:grid-cols-5 gap-6">
<div class="lg:col-span-2">
<div class="bg-slate-800/60 rounded-[24px] p-6 border border-slate-700">
<h2 class="text-2xl font-bold mb-1">Weather App</h2>
<p class="text-slate-400 text-sm mb-6">Real-time weather using Open-Meteo API </p>
<div class="relative">
<input id="cityInput" type="text" placeholder="Enter city e.g. Chennai" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 pr-12 text-sm outline-none focus:border-blue-500">
<button id="searchWeatherBtn" class="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-700 px-4 rounded-lg text-sm font-semibold"><i class="fas fa-search"></i></button>
</div>
<div class="flex gap-2 mt-3">
<button class="city-quick px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-full text-xs" data-city="Chennai">Tenkasi</button>
<button class="city-quick px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-full text-xs" data-city="Delhi">Tirunelveli</button>
<button class="city-quick px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-full text-xs" data-city="London">Madurai</button>
<button class="city-quick px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-full text-xs" data-city="New York">Sankarankovil</button>
</div>
<div id="weatherError" class="hidden mt-4 bg-red-500/10 border border-red-500/30 text-red-300 p-3 rounded-xl text-sm"></div>
</div>
</div>
<div class="lg:col-span-3">
<div id="weatherInitial" class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[24px] p-8 md:p-10 h-full flex flex-col justify-center items-center text-center"><i class="fas fa-cloud-sun text-6xl mb-4 opacity-80"></i><h3 class="text-2xl font-bold">Search weather information by city name</h3></div>
<div id="weatherResult" class="hidden">
<div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[24px] p-6 md:p-8 border border-blue-500/20"><div class="flex justify-between items-start"><div><h2 id="wCity" class="text-3xl font-bold"></h2><p id="wDate" class="text-blue-100 text-sm mt-1"></p><p id="wDesc" class="mt-3 inline-block bg-white/20 px-3 py-1 rounded-full text-sm capitalize"></p></div><div id="wIcon" class="text-6xl"></div></div><div class="mt-8 flex items-end gap-4"><div class="text-7xl font-bold tracking-tight" id="wTemp">--°</div><div class="pb-3"><p class="text-blue-100 text-sm">Feels like <span id="wFeels">--</span>°</p></div></div></div>
<div class="grid grid-cols-3 gap-4 mt-4">
<div class="bg-slate-800 rounded-2xl p-4 border border-slate-700"><p class="text-xs text-slate-400">Humidity</p><p id="wHumidity" class="text-xl font-bold mt-2">--%</p></div>
<div class="bg-slate-800 rounded-2xl p-4 border border-slate-700"><p class="text-xs text-slate-400">Wind Speed</p><p id="wWind" class="text-xl font-bold mt-2">-- km/h</p></div>
<div class="bg-slate-800 rounded-2xl p-4 border border-slate-700"><p class="text-xs text-slate-400">Ranges</p><p id="wRange" class="text-xl font-bold mt-2">--</p></div>
</div>
</div>
</div>
</div>
</section>
<section id="movie-section" class="hidden max-w-7xl mx-auto px-4 pb-10">
<div class="bg-slate-800/60 rounded-[24px] p-6 border border-slate-700 mb-6">
<div class="flex flex-col md:flex-row gap-4 justify-between md:items-center"><div><h2 class="text-2xl font-bold">Movie App</h2><p class="text-slate-400 text-sm mt-1">Search using OMDb API</p></div>
<div class="flex gap-2 flex-1 md:max-w-lg"><input id="movieInput" type="text" placeholder="Search movies e.g. Inception" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm"><button id="searchMovieBtn" class="bg-purple-600 hover:bg-purple-700 px-6 rounded-xl text-sm font-semibold">Search</button></div></div>
<div id="movieError" class="hidden mt-4 bg-red-500/10 border border-red-500/30 text-red-300 p-3 rounded-xl text-sm"></div>
</div>
<div id="movieInitial" class="bg-slate-800/30 border border-dashed border-slate-600 rounded-[24px] p-12 text-center"><h3 class="font-semibold">Search movies using a public movie database API</h3></div>
<div id="movieGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
</section>
<script>
const tabWeather=document.getElementById('tab-weather'),tabMovie=document.getElementById('tab-movie'),weatherSec=document.getElementById('weather-section'),movieSec=document.getElementById('movie-section');
tabWeather.onclick=()=>{tabWeather.classList.add('tab-active');tabWeather.classList.remove('text-slate-400');tabMovie.classList.remove('tab-active');tabMovie.classList.add('text-slate-400');weatherSec.classList.remove('hidden');movieSec.classList.add('hidden');}
tabMovie.onclick=()=>{tabMovie.classList.add('tab-active');tabMovie.classList.remove('text-slate-400');tabWeather.classList.remove('tab-active');tabWeather.classList.add('text-slate-400');movieSec.classList.remove('hidden');weatherSec.classList.add('hidden');}
const cityInput=document.getElementById('cityInput'),searchWeatherBtn=document.getElementById('searchWeatherBtn'),weatherError=document.getElementById('weatherError'),weatherInitial=document.getElementById('weatherInitial'),weatherResult=document.getElementById('weatherResult');
const weatherCodes={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',51:'Light drizzle',61:'Slight rain',71:'Slight snow',80:'Slight showers',95:'Thunderstorm'};
const weatherIcons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
const getWeather=async(city)=>{
 try{
  weatherError.classList.add('hidden');searchWeatherBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  const geoRes=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
  const geoData=await geoRes.json();
  if(!geoData.results||geoData.results.length===0) throw new Error(`City "${city}" not found.`);
  const {latitude,longitude,name,country}=geoData.results[0];
  const weatherRes=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
  const weatherData=await weatherRes.json();
  const {current,daily}=weatherData;
  const {temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m}=current;
  document.getElementById('wCity').textContent=`${name}, ${country}`;
  document.getElementById('wDate').textContent=new Date().toLocaleString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('wDesc').textContent=weatherCodes[weather_code]||`Code ${weather_code}`;
  document.getElementById('wIcon').textContent=weatherIcons[weather_code]||'🌡️';
  document.getElementById('wTemp').textContent=`${Math.round(temperature_2m)}°`;
  document.getElementById('wFeels').textContent=Math.round(apparent_temperature);
  document.getElementById('wHumidity').textContent=`${relative_humidity_2m}%`;
  document.getElementById('wWind').textContent=`${wind_speed_10m} km/h`;
  document.getElementById('wRange').textContent=`${Math.round(daily.temperature_2m_min[0])}° / ${Math.round(daily.temperature_2m_max[0])}°`;
  weatherInitial.classList.add('hidden');weatherResult.classList.remove('hidden');
 }catch(err){weatherError.textContent=`Error: ${err.message}`;weatherError.classList.remove('hidden');}
 finally{searchWeatherBtn.innerHTML='<i class="fas fa-search"></i>';}
}
searchWeatherBtn.addEventListener('click',()=>{if(cityInput.value.trim()) getWeather(cityInput.value.trim())});
cityInput.addEventListener('keypress',(e)=>{if(e.key==='Enter'&&cityInput.value.trim()) getWeather(cityInput.value.trim())});
document.querySelectorAll('.city-quick').forEach(btn=>btn.onclick=()=>{cityInput.value=btn.dataset.city;getWeather(btn.dataset.city);});
const movieInput=document.getElementById('movieInput'),searchMovieBtn=document.getElementById('searchMovieBtn'),movieGrid=document.getElementById('movieGrid'),movieInitial=document.getElementById('movieInitial'),movieError=document.getElementById('movieError');
const searchMovies=async(query)=>{
 try{
  movieError.classList.add('hidden');searchMovieBtn.innerHTML='Searching';movieGrid.innerHTML='';
  const res=await fetch(`https://www.omdbapi.com/?apikey=thewdb&s=${encodeURIComponent(query)}&type=movie`);
  const data=await res.json();
  if(data.Response==='False') throw new Error(data.Error||'No movies found');
  const movies=data.Search.slice(0,8);
  const detailedMovies=await Promise.all(movies.map(async(m)=>{
   try{const detailRes=await fetch(`https://www.omdbapi.com/?apikey=thewdb&i=${m.imdbID}&plot=short`);const detail=await detailRes.json();return detail.Response==='True'?detail:m;}catch{return m;}
  }));
  movieInitial.classList.add('hidden');
  movieGrid.innerHTML=detailedMovies.map(movie=>{
   const {Title,Year,Poster,imdbRating,Rated,Runtime,Genre,Plot}=movie;
   const posterSrc=Poster&&Poster!=='N/A'?Poster:'https://via.placeholder.com/300x445?text=No+Poster';
   const rating=imdbRating&&imdbRating!=='N/A'?imdbRating:'N/A';
   return `<div class="movie-card bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex flex-col"><div class="relative"><img src="${posterSrc}" class="w-full h-[300px] object-cover"><div class="absolute top-3 left-3 bg-black/70 px-2 py-1 rounded-full text-xs font-bold">⭐${rating}</div><div class="absolute top-3 right-3 bg-purple-600 px-2 py-1 rounded-full text-xs">${Year}</div></div><div class="p-4 flex-1 flex flex-col"><h3 class="font-bold text-[15px]">${Title}</h3><div class="flex gap-2 mt-2 text-[11px] text-slate-400"><span class="bg-slate-700 px-2 py-1 rounded">${Rated||'N/A'}</span><span class="bg-slate-700 px-2 py-1 rounded">${Runtime||'N/A'}</span></div><p class="text-[11px] text-slate-400 mt-2">${Genre||''}</p><p class="text-xs text-slate-300 mt-2 flex-1">${Plot&&Plot!=='N/A'?Plot:'No plot.'}</p></div></div>`;
  }).join('');
 }catch(err){movieError.textContent=`Error: ${err.message}`;movieError.classList.remove('hidden');}
 finally{searchMovieBtn.innerHTML='Search';}
}
searchMovieBtn.addEventListener('click',()=>{if(movieInput.value.trim()) searchMovies(movieInput.value.trim())});
movieInput.addEventListener('keypress',(e)=>{if(e.key==='Enter'&&movieInput.value.trim()) searchMovies(movieInput.value.trim())});
getWeather('Tenkasi');
</script>
</body>
</html>
